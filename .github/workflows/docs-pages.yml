name: Docs Pages

# Builds projects/docs and deploys projects/docs/dist to GitHub Pages for a
# stable release. This is the only workflow not taken from git-flow; building,
# testing and publishing to npm stay with the git-flow workflows:
#   test.yml               every push        build + test
#   build-pack-publish.yml release PR merge  build + pack + publish + tag
#
# Trigger: merging the release PR pushes to release/main. git-flow also tags
# the release (@cpangular/ng-material-theme/v<version>), but it does so with
# GITHUB_TOKEN, and events made with that token never start another workflow,
# so a tag trigger would never fire. Feature-line release branches
# (release/feature/*) publish prereleases and do not deploy docs.
# workflow_dispatch redeploys the current commit of any branch or tag.

on:
  push:
    branches:
      - "release/main"
  workflow_dispatch:

permissions:
  contents: read
  packages: read # install @cpdevtools/* from GitHub Packages (.npmrc)
  pages: write
  id-token: write

# One deploy at a time; a newer run supersedes a queued one but never cancels
# a deploy in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # setup-node's registry-url
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4 # version from package.json "packageManager"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com

      # Same as git-flow's actions: @cpdevtools/* come from GitHub Packages.
      - name: Configure registry auth
        run: pnpm config set "//npm.pkg.github.com/:_authToken" "$GITHUB_TOKEN"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        # library → material-demo → docs (devutil run build, dependency order)
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload docs
        uses: actions/upload-pages-artifact@v4
        with:
          path: projects/docs/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
