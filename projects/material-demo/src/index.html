<!doctype html>
<html lang="en" theme="indigo">
  <head>
    <meta charset="utf-8" />
    <title>Angular Material demo · ng-material-theme</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Before first paint: restore the stored theme and colour scheme, so the
         page never flashes the wrong one. The switcher reads the same keys. -->
    <script>
      try {
        var t = localStorage.getItem(
            "@cpangular/ng-material-theme.selectedTheme",
          ),
          s = localStorage.getItem("@cpangular/ng-material-theme.colorScheme");
        if (t) document.documentElement.setAttribute("theme", t);
        if (s === "light" || s === "dark")
          document.documentElement.style.colorScheme = s;
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
