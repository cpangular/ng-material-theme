<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Custom palettes</title>
    <link rel="stylesheet" href="08-custom-palettes.css" />
  </head>
  <body>
    <h2>brand, beside primary</h2>
    <div class="row">
      <div class="sw primary">primary</div>
      <div class="sw brand">brand</div>
    </div>

    <h2>Lighter and darker</h2>
    <div class="row">
      <div class="sw brand-darker-2">-darker-2</div>
      <div class="sw brand-darker-1">-darker-1</div>
      <div class="sw brand">brand</div>
      <div class="sw brand-lighter-1">-lighter-1</div>
      <div class="sw brand-lighter-2">-lighter-2</div>
    </div>

    <h2>Higher and lower, reverse mode, disabled</h2>
    <div class="row">
      <div class="sw brand-higher-1">-higher-1</div>
      <div class="sw brand-lower-1">-lower-1</div>
      <div class="sw brand-reverse-mode">-reverse-mode</div>
      <div class="sw brand-disabled">-disabled</div>
    </div>

    <h2>Tints</h2>
    <div class="row tints">
      <div class="sw brand-tint-1">1</div>
      <div class="sw brand-tint-2">2</div>
      <div class="sw brand-tint-3">3</div>
      <div class="sw brand-tint-4">4</div>
      <div class="sw brand-tint-5">5</div>
      <div class="sw brand-tint-6">6</div>
      <div class="sw brand-tint-7">7</div>
      <div class="sw brand-tint-8">8</div>
      <div class="sw brand-tint-9">9</div>
    </div>

    <h2>Contrast emphasis</h2>
    <div class="row">
      <div class="sw brand-high">--contrast--high</div>
      <div class="sw brand">--contrast</div>
      <div class="sw brand-low">--contrast--low</div>
    </div>
  </body>
</html>
