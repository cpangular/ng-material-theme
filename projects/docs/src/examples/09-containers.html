<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Containers</title>
    <link rel="stylesheet" href="09-containers.css" />
  </head>
  <body>
    <h2>Buttons</h2>
    <div class="row">
      <button class="filled">Filled</button>
      <button class="tonal">Tonal</button>
      <button class="outlined">Outlined</button>
      <button class="text">Text</button>
      <button class="danger">Delete</button>
      <button class="inverted">Inverted</button>
      <button class="filled" disabled>Disabled</button>
    </div>

    <h2>Cards</h2>
    <div class="row">
      <div class="card">
        <h3>Filled card</h3>
        <p>
          Heading in --container-color--high, this line in
          --container-color--low.
        </p>
      </div>
      <div class="card normal">
        <h3>Normal card</h3>
        <p>
          Text in the palette colour on the page surface; the border is the
          palette too.
        </p>
      </div>
    </div>
  </body>
</html>
