<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Containers</title>
    <link rel="stylesheet" href="09-containers.css" />
  </head>
  <body>
    <h2>Buttons</h2>
    <div class="row">
      <button class="filled">Filled</button>
      <button class="secondary">Secondary</button>
      <button class="outlined">Outlined</button>
      <button class="text">Text</button>
      <button class="danger">Delete</button>
      <button class="reverse">Reverse mode</button>
      <button class="filled" disabled>Disabled</button>
    </div>

    <h2>Cards</h2>
    <div class="row">
      <div class="card">
        <h3>Filled card</h3>
        <hr />
        <p>
          Heading and this line in --container-color--high, the rule above in
          --container-color--low.
        </p>
      </div>
      <div class="card normal">
        <h3>Normal card</h3>
        <hr />
        <p>
          Text in the palette colour on surface-container-lowest, which the card
          sets itself; the border is the palette too.
        </p>
      </div>
    </div>
  </body>
</html>
