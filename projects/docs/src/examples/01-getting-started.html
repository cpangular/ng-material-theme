<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Getting started</title>
    <link rel="stylesheet" href="../core.css" />
    <style>
      body {
        margin: 1rem;
        font:
          1rem/1.5 system-ui,
          sans-serif;
      }
      .box {
        padding: 1rem 1.5rem;
        border-radius: 0.5rem;
        background: var(--color--primary);
        color: var(--color--primary--contrast);
      }
    </style>
  </head>
  <body>
    <div class="box">
      This box is painted with <code>--color--primary</code>. Its text uses
      <code>--color--primary--contrast</code>, the text colour to use on
      primary.
    </div>
  </body>
</html>
