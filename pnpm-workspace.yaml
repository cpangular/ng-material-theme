packages:
  - 'projects/*'

# The git-flow toolchain ships on a prerelease cadence, so its packages are
# regularly younger than the default release-age cutoff. Exclude them by name.
minimumReleaseAgeExclude:
  - '@cpdevtools/git-flow'
  - '@cpdevtools/git-flow-cli'
  - '@cpdevtools/ts-dev-utilities'
  - '@cpdevtools/ts-dev-utilities-cli'
  - '@oclif/core'

# sass pulls in @parcel/watcher as an optional native watcher. It is not needed
# (sass falls back to chokidar), so its build script is deliberately not run.
allowBuilds:
  '@parcel/watcher': false
